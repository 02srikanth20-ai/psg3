
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bishop Run: Smart Single-Piece Hunt</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #0d1b2a 0%, #1b263b 50%, #0d1117 100%);
      --board-border: #1e293b;
      --light-square: #cbd5e1;
      --dark-square: #475569;
      --highlight: #00f5d4;
      --danger: #ff0055;
      --gold: #ffd166;
      --text: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(0, 245, 212, 0.12) 0%, transparent 70%);
      animation: ambientPulse 6s infinite alternate ease-in-out;
      z-index: 0;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1) translate(-30px, -30px); }
      100% { transform: scale(1.3) translate(30px, 30px); }
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 520px;
      width: 100%;
      z-index: 1;
    }

    header { text-align: center; }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #ffd166, #ff0055, #00f5d4);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGradient 4s ease infinite;
      margin-bottom: 2px;
      text-transform: uppercase;
      filter: drop-shadow(0 0 12px rgba(0, 245, 212, 0.3));
    }

    @keyframes titleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .difficulty-picker {
      display: flex;
      gap: 10px;
      margin-bottom: 5px;
    }

    .diff-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .diff-btn.active {
      background: var(--highlight);
      color: #000;
      border-color: var(--highlight);
      box-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--gold);
    }

    .board-wrapper {
      perspective: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .instruction-banner {
      background: rgba(0, 245, 212, 0.2);
      border: 1px solid var(--highlight);
      color: var(--highlight);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
      width: 100%;
      animation: bannerGlow 1.5s infinite alternate;
    }

    @keyframes bannerGlow {
      0% { box-shadow: 0 0 5px rgba(0, 245, 212, 0.3); }
      100% { box-shadow: 0 0 18px rgba(0, 245, 212, 0.8); }
    }

    .chessboard {
      width: 400px;
      height: 400px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      border: 10px solid var(--board-border);
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 245, 212, 0.25),
                  0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .square.light { background-color: var(--light-square); }
    .square.dark { background-color: var(--dark-square); }

    .square.spawn-select {
      background-color: rgba(0, 245, 212, 0.35) !important;
      animation: selectPulse 1s infinite alternate ease-in-out;
    }

    @keyframes selectPulse {
      0% { box-shadow: inset 0 0 5px var(--highlight); }
      100% { box-shadow: inset 0 0 20px var(--highlight); }
    }

    .square.valid-move::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: var(--highlight);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--highlight), 0 0 25px var(--highlight);
      animation: movePulse 1.2s infinite ease-in-out;
    }

    @keyframes movePulse {
      0% { transform: scale(0.8); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.7; }
    }

    .square.blocked-top::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
      background: var(--danger); box-shadow: 0 0 15px var(--danger); z-index: 10;
      animation: wallGlow 0.8s infinite alternate;
    }
    .square.blocked-bottom::before {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 6px;
      background: var(--danger); box-shadow: 0 0 15px var(--danger); z-index: 10;
      animation: wallGlow 0.8s infinite alternate;
    }
    .square.blocked-left::before {
      content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
      background: var(--danger); box-shadow: 0 0 15px var(--danger); z-index: 10;
      animation: wallGlow 0.8s infinite alternate;
    }
    .square.blocked-right::before {
      content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%;
      background: var(--danger); box-shadow: 0 0 15px var(--danger); z-index: 10;
      animation: wallGlow 0.8s infinite alternate;
    }

    @keyframes wallGlow {
      0% { opacity: 0.6; filter: drop-shadow(0 0 2px var(--danger)); }
      100% { opacity: 1; filter: drop-shadow(0 0 12px var(--danger)); }
    }

    .square.locked-square {
      background-color: rgba(255, 0, 85, 0.45) !important;
      animation: pulse-red 1.2s infinite alternate ease-in-out;
    }

    @keyframes pulse-red {
      0% { box-shadow: inset 0 0 15px var(--danger); }
      100% { box-shadow: inset 0 0 35px var(--danger); }
    }

    .piece {
      width: 80%;
      height: 80%;
      z-index: 2;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 6px 5px rgba(0, 0, 0, 0.5));
    }

    .piece svg {
      width: 100%;
      height: 100%;
    }

    .review-controls {
      display: none;
      gap: 10px;
      width: 100%;
      justify-content: center;
      align-items: center;
      margin-top: 5px;
    }

    .review-controls.active {
      display: flex;
    }

    .review-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .review-btn:hover:not(:disabled) {
      background: var(--highlight);
      color: #000;
    }

    .review-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .move-counter {
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 600;
      min-width: 90px;
      text-align: center;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      transform: translateY(20px);
      transition: transform 0.4s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-card h2 {
      font-size: 2.2rem;
      color: var(--danger);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .modal-card p {
      color: #cbd5e1;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .rating-badge {
      display: inline-block;
      margin: 12px 0;
      padding: 8px 20px;
      background: linear-gradient(135deg, #ffd166, #ff0055);
      color: #000;
      font-weight: 800;
      border-radius: 20px;
      font-size: 1.2rem;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    .btn {
      background: linear-gradient(135deg, #00f5d4, #00b4d8);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 245, 212, 0.4);
      flex: 1;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 245, 212, 0.6);
    }

    @media (max-width: 460px) {
      .chessboard { width: 320px; height: 320px; }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <h1>Bishop Run</h1>
      <div class="difficulty-picker">
        <button class="diff-btn active" id="btn-easy" onclick="setDifficulty('easy')">Easy Mode</button>
        <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">Hard Mode</button>
      </div>
    </header>

    <div class="hud">
      <div class="stat-box">
        <span class="stat-label">Turn</span>
        <span class="stat-value" id="turn-indicator">Place Bishop</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Escapes</span>
        <span class="stat-value" id="score-display">0</span>
      </div>
    </div>

    <div class="board-wrapper">
      <div class="instruction-banner" id="banner">
        &bigstar; Select a box on board to move bishop
      </div>
      <div class="chessboard" id="board"></div>

      <div class="review-controls" id="review-bar">
        <button class="review-btn" id="prev-btn" onclick="navigateMove(-1)">&larr; Prev</button>
        <span class="move-counter" id="move-counter">Move 0 / 0</span>
        <button class="review-btn" id="next-btn" onclick="navigateMove(1)">Next &rarr;</button>
        <button class="review-btn" onclick="initGame()" style="background:var(--highlight); color:#000;">New Game</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="game-over-modal">
    <div class="modal-card">
      <h2>Captured!</h2>
      <p>The Bishop has been cornered.</p>
      <p>Total Escapes: <strong id="final-score" style="color:var(--gold)">0</strong></p>
      <div>
        <span class="rating-badge" id="rating-display">Rating: 300 Elo</span>
      </div>
      <div class="button-group">
        <button class="btn btn-secondary" onclick="startReviewMode()">Game Review</button>
        <button class="btn" onclick="initGame()">New Game</button>
      </div>
    </div>
  </div>

  <script>
    const BISHOP_SVG = `
      <div class="piece" id="bishop">
        <svg viewBox="0 0 45 45">
          <g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <g fill="#ffffff" stroke="#000000">
              <path d="M 9,36 C 12.39,35.03 19.11,36.46 22.5,34 C 25.89,36.46 32.61,35.03 36,36 C 36,36 37.65,36.54 39,38 C 38.32,38.97 37.35,38.99 36,38.5 C 32.61,37.53 25.89,38.96 22.5,37.5 C 19.11,38.96 12.39,37.53 9,38.5 C 7.646,38.99 6.677,38.97 6,38 C 7.354,36.54 9,36 9,36 z"/>
              <path d="M 15,32 C 17.5,34.5 27.5,34.5 30,32 C 30.5,30.5 30,28.5 29,27 C 26,27 25.5,23.5 24.5,21 C 24.5,19.5 25.5,18 25.5,16 C 25.5,13.5 23,10.5 22.5,10 C 22,10.5 19.5,13.5 19.5,16 C 19.5,18 20.5,19.5 20.5,21 C 19.5,23.5 19,27 16,27 C 15,28.5 14.5,30.5 15,32 z"/>
              <path d="M 25 8 A 2.5 2.5 0 1 1  20,8 A 2.5 2.5 0 1 1  25 8 z"/>
            </g>
            <path d="M 17.5,26 L 27.5,26 M 15,30 L 30,30 M 22.5,15.5 L 22.5,20.5 M 20,18 L 25,18" stroke="#000" fill="none"/>
          </g>
        </svg>
      </div>`;

    const ROOK_SVG = `
      <div class="piece">
        <svg viewBox="0 0 45 45">
          <g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 9,39 L 36,39 L 36,36 L 9,36 L 9,39 z" fill="#111111" stroke="#000000" />
            <path d="M 12,36 L 12,32 L 33,32 L 33,36 L 12,36 z" fill="#111111" stroke="#000000" />
            <path d="M 11,14 L 11,9 L 15,9 L 15,11 L 20,11 L 20,9 L 25,9 L 25,11 L 30,11 L 30,9 L 34,9 L 34,14 L 31,17 L 31,29.5 L 14,29.5 L 14,17 L 11,14 z" fill="#111111" stroke="#000000" />
            <path d="M 12,14 L 33,14" stroke="#ffffff" />
            <path d="M 14,29.5 L 31,29.5" stroke="#ffffff" />
            <path d="M 14,16.5 L 31,16.5" stroke="#ffffff" />
            <path d="M 11,14 L 34,14" stroke="#000000" />
          </g>
        </svg>
      </div>`;

    const KNIGHT_SVG = `
      <div class="piece">
        <svg viewBox="0 0 45 45">
          <g fill="none" fill-rule="evenodd" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 20,25 22,10 z" fill="#111111" />
            <path d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,26.52 10,26 C 9,25.5 8.35,24.8 9,24 C 9.65,23.2 10.58,23.11 11,22 C 11.42,20.89 10.36,19.34 12,18 C 13.64,16.66 18.25,13.88 19,10 C 19.5,10 23,10 24,18 z" fill="#111111" />
            <path d="M 9.5 25.5 A 0.5 0.5 0 1 1 8.5,25.5 A 0.5 0.5 0 1 1 9.5 25.5 z" stroke="#ffffff" />
            <path d="M 15 15.5 A 0.5 1.5 0 1 1 14,15.5 A 0.5 1.5 0 1 1 15 15.5 z" transform="matrix(0.866,0.5,-0.5,0.866,9.693,-5.173)" stroke="#ffffff" />
          </g>
        </svg>
      </div>`;

    let bishopPos = null;
    let rook1Pos = { r: 0, c: 0 };
    let rook2Pos = { r: 1, c: 0 };
    let knight1Pos = { r: 5, c: 0 };
    let knight2Pos = { r: 0, c: 5 };

    let lastMovedPiece = null;

    let score = 0;
    let difficulty = 'easy';
    let minMovesThreshold = 6;
    let isPlacementPhase = true;
    let isPlayerTurn = false;
    let selectedMoves = [];
    let isGameOver = false;

    let moveHistory = [];
    let currentReviewIndex = 0;
    let isReviewMode = false;

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score-display');
    const turnEl = document.getElementById('turn-indicator');
    const modalEl = document.getElementById('game-over-modal');
    const reviewBarEl = document.getElementById('review-bar');
    const bannerEl = document.getElementById('banner');

    function setDifficulty(mode) {
      difficulty = mode;
      document.getElementById('btn-easy').classList.toggle('active', mode === 'easy');
      document.getElementById('btn-hard').classList.toggle('active', mode === 'hard');
      initGame();
    }

    function initGame() {
      score = 0;
      isPlacementPhase = true;
      isPlayerTurn = false;
      isGameOver = false;
      isReviewMode = false;
      bishopPos = null;
      lastMovedPiece = null;
      moveHistory = [];
      currentReviewIndex = 0;

      if (difficulty === 'easy') {
        minMovesThreshold = Math.floor(Math.random() * 4) + 6; // Range: 6 to 9
      } else {
        minMovesThreshold = Math.floor(Math.random() * 5) + 4; // Range: 4 to 8
      }

      scoreEl.textContent = score;
      turnEl.textContent = "Place Bishop";
      turnEl.style.color = "var(--highlight)";
      modalEl.classList.remove('active');
      reviewBarEl.classList.remove('active');
      bannerEl.style.display = 'block';

      rook1Pos = { r: 0, c: 0 };
      rook2Pos = { r: 1, c: 0 };
      knight1Pos = { r: 5, c: 0 };
      knight2Pos = { r: 0, c: 5 };

      renderBoard();
    }

    function recordState(actionName) {
      moveHistory.push({
        action: actionName,
        bishop: bishopPos ? { ...bishopPos } : null,
        r1: { ...rook1Pos },
        r2: { ...rook2Pos },
        kn1: { ...knight1Pos },
        kn2: { ...knight2Pos }
      });
    }

    function renderBoard(overrideState = null) {
      boardEl.innerHTML = '';

      const bPos = overrideState ? overrideState.bishop : bishopPos;
      const r1 = overrideState ? overrideState.r1 : rook1Pos;
      const r2 = overrideState ? overrideState.r2 : rook2Pos;
      const kn1 = overrideState ? overrideState.kn1 : knight1Pos;
      const kn2 = overrideState ? overrideState.kn2 : knight2Pos;

      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          square.dataset.row = r;
          square.dataset.col = c;

          const isEnemyTile = (r === r1.r && c === r1.c) ||
                              (r === r2.r && c === r2.c) ||
                              (r === kn1.r && c === kn1.c) ||
                              (r === kn2.r && c === kn2.c);

          if (isPlacementPhase && !isEnemyTile) {
            square.classList.add('spawn-select');
          }

          if (bPos && r === bPos.r && c === bPos.c) {
            square.innerHTML = BISHOP_SVG;
          } else if (r === r1.r && c === r1.c) {
            square.innerHTML = ROOK_SVG;
          } else if (r === r2.r && c === r2.c) {
            square.innerHTML = ROOK_SVG;
          } else if (r === kn1.r && c === kn1.c) {
            square.innerHTML = KNIGHT_SVG;
          } else if (r === kn2.r && c === kn2.c) {
            square.innerHTML = KNIGHT_SVG;
          }

          if (!isReviewMode) {
            square.addEventListener('click', () => handleSquareClick(r, c));
          }
          boardEl.appendChild(square);
        }
      }
    }

    function handleSquareClick(r, c) {
      if (isGameOver || isReviewMode) return;

      if (isPlacementPhase) {
        const isEnemyTile = (r === rook1Pos.r && c === rook1Pos.c) ||
                            (r === rook2Pos.r && c === rook2Pos.c) ||
                            (r === knight1Pos.r && c === knight1Pos.c) ||
                            (r === knight2Pos.r && c === knight2Pos.c);
        if (isEnemyTile) return;

        bishopPos = { r, c };
        isPlacementPhase = false;
        isPlayerTurn = true;
        turnEl.textContent = "Bishop Turn";
        turnEl.style.color = "var(--gold)";
        bannerEl.style.display = 'none';

        recordState("Bishop Placed");
        renderBoard();
        highlightValidMoves();
        return;
      }

      if (!isPlayerTurn) return;

      const isValid = selectedMoves.some(m => m.r === r && m.c === c);
      if (!isValid) return;

      bishopPos = { r, c };
      score++;
      scoreEl.textContent = score;

      recordState(`Move ${score}`);
      renderBoard();

      isPlayerTurn = false;
      turnEl.textContent = "AI Turn";
      turnEl.style.color = "var(--danger)";
      clearHighlights();

      setTimeout(makeBestSinglePieceAIMove, 400);
    }

    function getBishopMoves(pos, r1 = rook1Pos, r2 = rook2Pos, kn1 = knight1Pos, kn2 = knight2Pos) {
      const moves = [];
      const directions = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

      for (let [dr, dc] of directions) {
        let nr = pos.r + dr;
        let nc = pos.c + dc;
        while (nr >= 0 && nr < 6 && nc >= 0 && nc < 6) {
          if ((nr === r1.r && nc === r1.c) || 
              (nr === r2.r && nc === r2.c) ||
              (nr === kn1.r && nc === kn1.c) ||
              (nr === kn2.r && nc === kn2.c)) {
            break;
          }
          moves.push({ r: nr, c: nc });
          nr += dr;
          nc += dc;
        }
      }
      return moves;
    }

    function getBishopAttackSquares(bPos, r1 = rook1Pos, r2 = rook2Pos, kn1 = knight1Pos, kn2 = knight2Pos) {
      const moves = [];
      const directions = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

      for (let [dr, dc] of directions) {
        let nr = bPos.r + dr;
        let nc = bPos.c + dc;
        while (nr >= 0 && nr < 6 && nc >= 0 && nc < 6) {
          moves.push({ r: nr, c: nc });
          if ((nr === r1.r && nc === r1.c) || 
              (nr === r2.r && nc === r2.c) ||
              (nr === kn1.r && nc === kn1.c) ||
              (nr === kn2.r && nc === kn2.c)) {
            break;
          }
          nr += dr;
          nc += dc;
        }
      }
      return moves;
    }

    function isSquareAttackedByEnemies(r, c, r1 = rook1Pos, r2 = rook2Pos, kn1 = knight1Pos, kn2 = knight2Pos) {
      if ((r1.r === r || r1.c === c) && !(r1.r === r && r1.c === c)) return true;
      if ((r2.r === r || r2.c === c) && !(r2.r === r && r2.c === c)) return true;

      const knightOffsets = [
        [-2, -1], [-2, 1], [-1, -2], [-1, 2],
        [1, -2], [1, 2], [2, -1], [2, 1]
      ];
      for (let [dr, dc] of knightOffsets) {
        if ((kn1.r + dr === r && kn1.c + dc === c) || (kn2.r + dr === r && kn2.c + dc === c)) return true;
      }

      return false;
    }

    function calculateTotalControlledSquares(r1, r2, kn1, kn2) {
      const controlled = new Set();

      const r1Moves = getRookMoves(r1, r2, kn1, kn2);
      r1Moves.forEach(m => controlled.add(`${m.r},${m.c}`));

      const r2Moves = getRookMoves(r2, r1, kn1, kn2);
      r2Moves.forEach(m => controlled.add(`${m.r},${m.c}`));

      const kn1Moves = getKnightMoves(kn1, kn2, r1, r2);
      kn1Moves.forEach(m => controlled.add(`${m.r},${m.c}`));

      const kn2Moves = getKnightMoves(kn2, kn1, r1, r2);
      kn2Moves.forEach(m => controlled.add(`${m.r},${m.c}`));

      return controlled.size;
    }

    function highlightValidMoves() {
      clearHighlights();
      if (!isPlayerTurn || isGameOver || isReviewMode) return;

      const allBishopMoves = getBishopMoves(bishopPos);
      selectedMoves = allBishopMoves.filter(m => !isSquareAttackedByEnemies(m.r, m.c));

      if (selectedMoves.length === 0) {
        endGame();
        return;
      }

      selectedMoves.forEach(m => {
        const sq = getSquareEl(m.r, m.c);
        if (sq) sq.classList.add('valid-move');
      });
    }

    function clearHighlights() {
      document.querySelectorAll('.square').forEach(sq => {
        sq.classList.remove('valid-move');
        sq.classList.remove('spawn-select');
      });
    }

    function makeBestSinglePieceAIMove() {
      if (isGameOver || isReviewMode) return;

      const allCandidateMoves = [];

      getRookMoves(rook1Pos, rook2Pos, knight1Pos, knight2Pos).forEach(dest => {
        allCandidateMoves.push({ piece: 'r1', from: rook1Pos, to: dest });
      });

      getRookMoves(rook2Pos, rook1Pos, knight1Pos, knight2Pos).forEach(dest => {
        allCandidateMoves.push({ piece: 'r2', from: rook2Pos, to: dest });
      });

      getKnightMoves(knight1Pos, knight2Pos, rook1Pos, rook2Pos).forEach(dest => {
        allCandidateMoves.push({ piece: 'kn1', from: knight1Pos, to: dest });
      });

      getKnightMoves(knight2Pos, knight1Pos, rook1Pos, rook2Pos).forEach(dest => {
        allCandidateMoves.push({ piece: 'kn2', from: knight2Pos, to: dest });
      });

      let bestAction = null;
      let bestScore = -Infinity;

      for (let move of allCandidateMoves) {
        let simR1 = move.piece === 'r1' ? move.to : rook1Pos;
        let simR2 = move.piece === 'r2' ? move.to : rook2Pos;
        let simKn1 = move.piece === 'kn1' ? move.to : knight1Pos;
        let simKn2 = move.piece === 'kn2' ? move.to : knight2Pos;

        const isDirectCapture = (move.to.r === bishopPos.r && move.to.c === bishopPos.c);

        if (isDirectCapture) {
          bestAction = move;
          break;
        }

        const attackedByBishop = getBishopAttackSquares(bishopPos, simR1, simR2, simKn1, simKn2);
        const isDangerSquare = attackedByBishop.some(sq => sq.r === move.to.r && sq.c === move.to.c);
        if (isDangerSquare) {
          continue;
        }

        const futureEscapes = getBishopMoves(bishopPos, simR1, simR2, simKn1, simKn2).filter(
          m => !isSquareAttackedByEnemies(m.r, m.c, simR1, simR2, simKn1, simKn2)
        );

        if (score < minMovesThreshold && futureEscapes.length === 0) {
          continue;
        }

        const totalControlled = calculateTotalControlledSquares(simR1, simR2, simKn1, simKn2);

        let moveScore = (-futureEscapes.length * 100) + totalControlled;

        if (move.piece === lastMovedPiece) {
          moveScore -= 15;
        }

        if (move.piece.startsWith('kn')) {
          moveScore += 8;
        }

        if (moveScore > bestScore) {
          bestScore = moveScore;
          bestAction = move;
        }
      }

      if (!bestAction && allCandidateMoves.length > 0) {
        const safeCandidates = allCandidateMoves.filter(m => {
          const attacked = getBishopAttackSquares(bishopPos);
          return !attacked.some(sq => sq.r === m.to.r && sq.c === m.to.c);
        });
        if (safeCandidates.length > 0) {
          bestAction = safeCandidates[Math.floor(Math.random() * safeCandidates.length)];
        } else {
          bestAction = allCandidateMoves[Math.floor(Math.random() * allCandidateMoves.length)];
        }
      }

      if (bestAction) {
        if (bestAction.piece === 'r1') rook1Pos = bestAction.to;
        else if (bestAction.piece === 'r2') rook2Pos = bestAction.to;
        else if (bestAction.piece === 'kn1') knight1Pos = bestAction.to;
        else if (bestAction.piece === 'kn2') knight2Pos = bestAction.to;

        lastMovedPiece = bestAction.piece;
      }

      recordState(`AI Move (${bestAction ? bestAction.piece.toUpperCase() : 'None'})`);
      renderBoard();

      // Check if AI landed directly on the Bishop's square
      if (bestAction && bestAction.to.r === bishopPos.r && bestAction.to.c === bishopPos.c) {
        endGame();
        return;
      }

      // Check remaining safe escape moves for the Bishop
      const currentSafeMoves = getBishopMoves(bishopPos).filter(
        m => !isSquareAttackedByEnemies(m.r, m.c)
      );

      // Game over ONLY if the Bishop has ZERO safe moves left
      if (currentSafeMoves.length === 0) {
        endGame();
      } else {
        isPlayerTurn = true;
        turnEl.textContent = "Bishop Turn";
        turnEl.style.color = "var(--gold)";
        highlightValidMoves();
      }
    }

    function getRookMoves(rook, oRook, kn1, kn2) {
      const moves = [];
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

      for (let [dr, dc] of dirs) {
        let nr = rook.r + dr;
        let nc = rook.c + dc;
        while (nr >= 0 && nr < 6 && nc >= 0 && nc < 6) {
          if ((nr === oRook.r && nc === oRook.c) || 
              (nr === kn1.r && nc === kn1.c) || 
              (nr === kn2.r && nc === kn2.c)) break;
          moves.push({ r: nr, c: nc });
          nr += dr;
          nc += dc;
        }
      }
      return moves;
    }

    function getKnightMoves(knight, oKnight, r1, r2) {
      const moves = [];
      const offsets = [
        [-2, -1], [-2, 1], [-1, -2], [-1, 2],
        [1, -2], [1, 2], [2, -1], [2, 1]
      ];

      for (let [dr, dc] of offsets) {
        let nr = knight.r + dr;
        let nc = knight.c + dc;
        if (nr >= 0 && nr < 6 && nc >= 0 && nc < 6) {
          if ((nr === oKnight.r && nc === oKnight.c) || 
              (nr === r1.r && nc === r1.c) || 
              (nr === r2.r && nc === r2.c)) continue;
          moves.push({ r: nr, c: nc });
        }
      }
      return moves;
    }

    function getSquareEl(r, c) {
      return document.querySelector(`.square[data-row="${r}"][data-col="${c}"]`);
    }

    function calculateRating(escapes) {
      let rating = 300 + (escapes * 60);
      return Math.min(Math.max(rating, 300), 950);
    }

    function endGame() {
      if (isGameOver) return;
      isGameOver = true;
      turnEl.textContent = "Locked!";
      turnEl.style.color = "var(--danger)";

      showBlockedDirections();

      setTimeout(() => {
        document.getElementById('final-score').textContent = score;
        const rating = calculateRating(score);
        document.getElementById('rating-display').textContent = `Rating: ${rating} Elo`;
        modalEl.classList.add('active');
      }, 4000);
    }

    function showBlockedDirections() {
      if (!bishopPos) return;
      const bSq = getSquareEl(bishopPos.r, bishopPos.c);
      if (bSq) bSq.classList.add('locked-square');

      const possibleBishopDirections = [
        { dr: -1, dc: -1, top: true, left: true },
        { dr: -1, dc: 1,  top: true, right: true },
        { dr: 1,  dc: -1, bottom: true, left: true },
        { dr: 1,  dc: 1,  bottom: true, right: true }
      ];

      possibleBishopDirections.forEach(dir => {
        let targetR = bishopPos.r + dir.dr;
        let targetC = bishopPos.c + dir.dc;

        if (
          targetR < 0 || targetR >= 6 || 
          targetC < 0 || targetC >= 6 || 
          isSquareAttackedByEnemies(targetR, targetC)
        ) {
          if (bSq) {
            if (dir.top) bSq.classList.add('blocked-top');
            if (dir.bottom) bSq.classList.add('blocked-bottom');
            if (dir.left) bSq.classList.add('blocked-left');
            if (dir.right) bSq.classList.add('blocked-right');
          }
        }
      });
    }

    function startReviewMode() {
      isReviewMode = true;
      modalEl.classList.remove('active');
      reviewBarEl.classList.add('active');
      turnEl.textContent = "Review Mode";
      turnEl.style.color = "var(--highlight)";

      currentReviewIndex = 0;
      updateReviewDisplay();
    }

    function navigateMove(dir) {
      if (!isReviewMode) return;
      const newIndex = currentReviewIndex + dir;
      if (newIndex >= 0 && newIndex < moveHistory.length) {
        currentReviewIndex = newIndex;
        updateReviewDisplay();
      }
    }

    function updateReviewDisplay() {
      const state = moveHistory[currentReviewIndex];
      renderBoard(state);

      document.getElementById('move-counter').textContent = 
        `Step ${currentReviewIndex} / ${moveHistory.length - 1}`;

      document.getElementById('prev-btn').disabled = (currentReviewIndex === 0);
      document.getElementById('next-btn').disabled = (currentReviewIndex === moveHistory.length - 1);
    }

    document.addEventListener('keydown', (e) => {
      if (!isReviewMode) return;
      if (e.key === 'ArrowLeft') navigateMove(-1);
      if (e.key === 'ArrowRight') navigateMove(1);
    });

    initGame();
  </script>
